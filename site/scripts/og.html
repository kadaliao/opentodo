<!doctype html>
<!-- 分享预览图（og.png，1200×630）的模板：site/scripts/images.sh 用无头 Chrome 把它截成图 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; color: #1d1d1f; position: relative; }
  .text { position: absolute; left: 80px; top: 120px; width: 470px; }
  .text img { width: 120px; height: 120px; margin-left: -12px; }
  .name { margin-top: 18px; font-size: 34px; font-weight: 600; }
  .line { margin-top: 8px; font-size: 64px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
  .sub { margin-top: 22px; font-size: 24px; color: #6e6e73; line-height: 1.45; }
  .shot { position: absolute; left: 600px; top: 96px; width: 900px;
          filter: drop-shadow(0 24px 40px rgba(0,0,0,.2)) drop-shadow(0 2px 6px rgba(0,0,0,.1)); }
</style></head>
<body>
  <div class="text">
    <img src="../img/icon-256.png" alt="">
    <div class="name">OpenTodo</div>
    <div class="line">安排好每一天。</div>
    <div class="sub">为 Mac 原生打造的开源待办清单。<br>离线可用，同步服务可以自己部署。</div>
  </div>
  <img class="shot" src="../img/detail-light-1280.webp" alt="">
</body></html>
